<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aniversariantes de hoje</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="topo">

        <h1>Painel de Aniversariantes</h1>

        <nav>

            <a href="hoje.html">
                Hoje
            </a>

            <a href="calendario.html">
                Calendário
            </a>

            <a href="cadastro.html">
                Cadastrar
            </a>

        </nav>

    </header>


    <main>

        <section class="cabecalho-pagina">

            <h2>Aniversariantes de hoje</h2>

            <p>
                Pessoas que fazem aniversário hoje.
            </p>

        </section>


        <section>

            <div id="listaAniversariantes">

                <p class="carregando">
                    Carregando...
                </p>

            </div>

        </section>


        <section class="pesquisa">

            <h2>Pesquisar pessoa</h2>

            <form id="formPesquisa">

                <input
                    type="text"
                    id="termoPesquisa"
                    placeholder="Digite o nome"
                    required
                >

                <button type="submit">
                    Pesquisar
                </button>

            </form>

        </section>


        <p
            id="mensagemErro"
            class="mensagem-erro"
            hidden
        ></p>

    </main>


    <script src="js/api.js"></script>
    <script src="js/hoje.js"></script>

</body>

</html>
